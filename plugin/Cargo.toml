[package]
name = "sosatune"
version = "0.1.0"
edition = "2021"
authors = ["Vladislav"]
# nih-plug con il formato VST3 richiede la licenza GPL v3.
license = "GPL-3.0-or-later"
description = "Correzione dell'intonazione in tempo reale per la voce (VST3 / CLAP)"

[lib]
# "cdylib" e' la libreria dinamica che diventa il plugin.
crate-type = ["cdylib", "lib"]

[dependencies]
sosatune_dsp = { path = "../dsp" }

# Il framework per i plugin audio, fissato a una revisione precisa cosi' il
# progetto si compila sempre allo stesso modo.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }

# Interfaccia grafica: egui disegnato con OpenGL dentro la finestra del DAW.
# Il collegamento (cartella src/gui) e' ricavato da nih_plug_egui, con le
# stesse versioni delle librerie.
# "windows_keyboard_workaround": su Windows la finestra del plugin prende la
# tastiera quando si clicca un numero per scriverlo (altrimenti i tasti
# andrebbero al DAW).
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", features = ["opengl", "default_fonts", "windows_keyboard_workaround"] }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
raw-window-handle = "0.5"
crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
# "Save As Default": le impostazioni predefinite in un piccolo file JSON.
serde_json = "1.0"

[dev-dependencies]
# Solo per examples/anteprima.rs (salva l'anteprima dell'interfaccia in PNG).
png = "0.17"
