[package]
name = "sosatune"
version = "0.1.0"
edition = "2021"
authors = ["Vladislav"]
# nih-plug con il formato VST3 richiede la licenza GPL v3.
license = "GPL-3.0-or-later"
description = "Correzione dell'intonazione in tempo reale per la voce (VST3 / CLAP)"

[lib]
# "cdylib" e' la libreria dinamica che diventa il plugin.
crate-type = ["cdylib", "lib"]

[dependencies]
sosatune_dsp = { path = "../dsp" }

# Il framework per i plugin audio, fissato a una revisione precisa cosi' il
# progetto si compila sempre allo stesso modo.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
