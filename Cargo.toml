# SosaTune — correzione dell'intonazione in tempo reale (stile Auto-Tune).
#
# Il progetto e' diviso in tre parti ("crate"):
#   dsp/     il motore audio: rilevamento dell'intonazione, scale, correzione,
#            pitch shifting. Non dipende da nessuna libreria esterna, quindi si
#            puo' testare da solo anche senza un DAW.
#   plugin/  il plugin vero e proprio (VST3 + CLAP) con l'interfaccia grafica.
#   xtask/   un aiutante che impacchetta il plugin: `cargo xtask bundle sosatune --release`

[workspace]
members = ["dsp", "plugin", "xtask"]
exclude = ["vendor"]
resolver = "2"

# nih-plug con alcune correzioni di compatibilita' (vedi vendor/nih-plug-sosatune.patch):
# - CLAP: latenza comunicata all'host solo nei momenti permessi dalle specifiche
# - CLAP: dopo il caricamento di un progetto l'host rilegge i valori dei parametri
# - CLAP: ingresso mono -> uscita stereo dichiarato correttamente
# - CLAP e VST3: dati di stato corrotti non fanno piu' chiudere il DAW
# - VST3: le manopole funzionano anche negli host/contenitori che non rimandano le modifiche
# - CLAP, AU (Logic Pro) e VST3: le modifiche fatte nella finestra del plugin vengono
#   applicate subito, qualunque cosa faccia l'host (traccia vuota, trasporto fermo, plugin
#   appena inserito): le manopole non restano mai "morte"
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih-plug" }

[profile.release]
lto = "thin"
strip = "symbols"

# I test del motore audio girano molto piu' veloci con le ottimizzazioni attive.
[profile.test]
opt-level = 3
