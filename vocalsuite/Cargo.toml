[package]
name = "srvocalsuite"
version = "1.0.0"
edition = "2021"
authors = ["Vladislav"]
# nih-plug con il formato VST3 richiede la licenza GPL v3.
license = "GPL-3.0-or-later"
description = "SR Vocal Suite: correzione dell'intonazione (motore SosaTune) con chorus Juno/FL, tape echo stile Space Echo, riverbero e formanti"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
sosatune_dsp = { path = "../dsp" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", features = ["opengl", "default_fonts", "windows_keyboard_workaround"] }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
raw-window-handle = "0.5"
crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# La grafica (assets/skin.png) viene decodificata all'apertura della finestra.
png = "0.17"
