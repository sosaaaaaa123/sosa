# Compila automaticamente il plugin per Mac su GitHub (gratis per i progetti
# pubblici e, entro certi limiti, anche per quelli privati).
# Ogni volta che carichi delle modifiche, nella scheda "Actions" del progetto
# trovi lo zip "SosaTune-macOS" con i file .vst3 e .clap pronti da installare.

name: Compila per Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serve per pubblicare lo zip compilato nel ramo "build".
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Installa Rust (per Mac Intel e Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Test del motore audio
        run: cargo test -p sosatune_dsp --release

      - name: Compila il plugin (universale Intel + Apple Silicon)
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: cargo xtask bundle-universal sosatune --release

      - name: Prepara lo zip
        run: |
          cd target/bundled
          zip -r ../../SosaTune-macOS.zip SosaTune.vst3 SosaTune.clap

      - uses: actions/upload-artifact@v4
        with:
          name: SosaTune-macOS
          path: SosaTune-macOS.zip

      # Lo zip finisce anche nel ramo "build" del repository: si scarica da
      # GitHub con un clic, senza dover aprire la scheda Actions.
      - name: Pubblica lo zip nel ramo build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          OUT="$RUNNER_TEMP/build-branch"
          mkdir -p "$OUT"
          cp SosaTune-macOS.zip "$OUT/"
          cd "$OUT"
          git init -q -b build
          git add SosaTune-macOS.zip
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "SosaTune per Mac (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build:build
