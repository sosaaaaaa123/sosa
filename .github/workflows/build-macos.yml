# Compila automaticamente il plugin per Mac su GitHub (gratis per i progetti
# pubblici e, entro certi limiti, anche per quelli privati).
# Ogni volta che carichi delle modifiche, lo zip "SosaTune-macOS.zip" con i file
# .vst3 e .clap pronti da installare finisce nel ramo "build" del repository,
# insieme a "rapporto.txt" con il risultato dei controlli.

name: Compila per Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serve per pubblicare lo zip compilato nel ramo "build".
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Installa Rust (per Mac Intel e Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Test del motore audio
        run: cargo test -p sosatune_dsp --release

      - name: Compila il plugin (universale Intel + Apple Silicon)
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: cargo xtask bundle-universal sosatune --release 2>&1 | tee build-log.txt

      # Eseguibile in formato "bundle" (come i plugin JUCE): serve a FL Studio.
      - name: Crea i pacchetti in formato bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: scripts/macos-bundle.sh 2>&1 | tee bundle-log.txt

      # Il validatore ufficiale di Steinberg (gli inventori del VST3): e' lo
      # stesso controllo che usano Cubase, Pro Tools/PatchWork e gli altri host
      # per la conformita' (canali mono/stereo, bypass, stato, latenza...).
      - name: Prova con il validatore ufficiale Steinberg VST3
        if: always()
        run: |
          set +e
          {
            git clone -q --depth 1 --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git
            cmake -S vst3sdk -B vst3build -DCMAKE_BUILD_TYPE=Release \
              -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
              -DSMTG_RUN_VST_VALIDATOR=OFF > vst3sdk-cmake.txt 2>&1
            cmake --build vst3build --target validator --config Release -j 4 > vst3sdk-build.txt 2>&1
          } || { echo "compilazione del validatore non riuscita"; tail -40 vst3sdk-cmake.txt vst3sdk-build.txt; }
          VAL=$(find vst3build -type f -name validator -perm -u+x | head -1)
          echo "validatore: $VAL"
          if [ -n "$VAL" ]; then
            "$VAL" -e target/bundled-mhbundle/SosaTune.vst3 > steinberg.txt 2>&1
            echo "exit code: $?" >> steinberg.txt
          else
            { echo "validatore non disponibile"; tail -60 vst3sdk-build.txt; } > steinberg.txt 2>&1
          fi
          tail -60 steinberg.txt

      # clap-validator: lo stesso tipo di controllo per il formato CLAP
      # (Bitwig, Reaper, FL Studio 2024+...).
      - name: Prova con clap-validator
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p cv && cd cv
          gh release download --repo free-audio/clap-validator --pattern '*macos-universal*' || true
          # Gli archivi possono contenerne altri: li apriamo finche' ce ne sono.
          for round in 1 2 3; do
            for f in $(find . -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' -o -name '*.tar' \)); do
              case "$f" in *.zip) unzip -qo "$f" -d "$(dirname "$f")";; *) tar xf "$f" -C "$(dirname "$f")";; esac
              rm -f "$f"
            done
          done
          CV=$(find "$PWD" -type f -name 'clap-validator*' ! -name '*.*' | head -1)
          cd ..
          if [ -n "$CV" ]; then
            chmod +x "$CV"
            xattr -cr cv || true
            "$CV" validate target/bundled-mhbundle/SosaTune.clap > clap-validator.txt 2>&1
            echo "exit code: $?" >> clap-validator.txt
          else
            { echo "clap-validator non trovato"; find cv | head -50; } > clap-validator.txt
          fi
          tail -60 clap-validator.txt

      # pluginval (Tracktion) carica il plugin come farebbe un DAW e lo mette
      # alla prova al livello piu' severo (10): apertura, parametri, audio,
      # salvataggio e ripristino, chiamate da piu' thread, interfaccia grafica.
      - name: Prova i plugin con pluginval
        if: always()
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          run_pv() {
            echo "===== pluginval: $1 ====="
            # Limite di 20 minuti: se qualcosa si blocca lo vediamo nel rapporto.
            perl -e 'alarm shift; exec @ARGV' 1200 "$PV" --strictness-level 10 --validate-in-process --verbose --timeout-ms 120000 "$1" > "pv-$2.txt" 2>&1
            echo "exit code: $?" >> "pv-$2.txt"
            tail -80 "pv-$2.txt"
          }
          run_pv target/bundled-mhbundle/SosaTune.vst3 vst3 || true

      - name: Prepara lo zip e il rapporto
        if: always()
        run: |
          (cd target/bundled-mhbundle && zip -qry ../../SosaTune-macOS.zip SosaTune.vst3 SosaTune.clap) || true
          {
            echo "SosaTune ${GITHUB_SHA::7} - $(date -u)"
            echo
            echo "## Formato degli eseguibili"
            file target/bundled-mhbundle/SosaTune.vst3/Contents/MacOS/SosaTune target/bundled/SosaTune.vst3/Contents/MacOS/SosaTune || true
            echo
            echo "## Simboli esportati (bundle)"
            nm -gU target/bundled-mhbundle/SosaTune.vst3/Contents/MacOS/SosaTune || true
            echo
            echo "## Firma"
            codesign -dv --verbose=2 target/bundled-mhbundle/SosaTune.vst3 2>&1 || true
            echo
            echo "## Compilazione (ultime righe)"
            tail -60 build-log.txt || true
            echo
            echo "## Creazione dei pacchetti"
            cat bundle-log.txt || true
            echo
            echo "## pluginval livello 10 - VST3"
            cat pv-vst3.txt || true
            echo
            echo "## Validatore ufficiale Steinberg VST3"
            cat steinberg.txt || true
            echo
            echo "## clap-validator"
            cat clap-validator.txt || true
          } > rapporto.txt 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SosaTune-macOS
          path: |
            SosaTune-macOS.zip
            rapporto.txt

      # Lo zip e il rapporto finiscono anche nel ramo "build" del repository:
      # si scaricano da GitHub con un clic, senza dover aprire la scheda Actions.
      - name: Pubblica nel ramo build
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/build-branch"
          mkdir -p "$OUT"
          cp rapporto.txt "$OUT/"
          if [ -f SosaTune-macOS.zip ]; then cp SosaTune-macOS.zip "$OUT/"; fi
          cd "$OUT"
          git init -q -b build
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "SosaTune per Mac (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build:build
