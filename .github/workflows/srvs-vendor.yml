# Temporaneo: prepara le librerie Rust (solo Linux) per compilare e provare
# SR Vocal Suite fuori da GitHub. Si puo' cancellare.
name: SRVS vendor
on:
  push:
    branches: [sr-vocal-suite]
    paths: [".github/workflows/srvs-vendor.yml"]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: vendor
        run: |
          cargo install cargo-vendor-filterer --locked
          cargo vendor-filterer --platform=x86_64-unknown-linux-gnu --exclude-crate-path='*#tests' --exclude-crate-path='*#benches' --exclude-crate-path='*#examples' vendor-linux > vendor-config.toml
          du -sh vendor-linux
          tar -czf vendor-linux.tar.zst vendor-linux vendor-config.toml
          ls -la vendor-linux.tar.zst
          split -b 45m vendor-linux.tar.zst vendor-linux.tar.zst.part-
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"; cp vendor-linux.tar.zst.part-* vendor-config.toml "$OUT/"
          cd "$OUT" && git init -q -b srvs-vendor && git add . \
            && git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m vendor \
            && git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" srvs-vendor:srvs-vendor
